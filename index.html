<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prop Firm Guardian | Risk Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .badge {
            background: #1e293b; color: #94a3b8;
            padding: 5px 15px; border-radius: 20px;
            font-size: 0.8rem; letter-spacing: 1px;
            border: 1px solid #334155; margin-bottom: 10px;
        }

        h1 { margin: 10px 0; color: #38bdf8; text-align: center; }

        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        label { display: block; margin-top: 15px; color: #cbd5e1; font-size: 0.9rem; }
        
        input, select {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 10px;
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            font-weight: bold;
        }
        input:focus { border-color: #38bdf8; }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 25px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }

        .result-area {
            margin-top: 30px;
            text-align: center;
            display: none;
            padding: 20px;
            border-radius: 15px;
            background: #0f172a;
        }

        .lot-display { font-size: 3rem; font-weight: 800; color: #fff; margin: 10px 0; display: block; }
        .risk-display { color: #94a3b8; font-size: 0.9rem; }
        
        .safe-mode { border: 2px solid #22c55e; background: rgba(34, 197, 94, 0.1); }
        .danger-mode { border: 2px solid #ef4444; background: rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body>

    <div class="badge">PROP FIRM PROTECTION</div>
    <h1>Risk Guard</h1>

    <div class="container">
        
        <label>Account Balance ($)</label>
        <input type="number" id="balance" value="10000" placeholder="e.g. 50000">

        <label>Risk Percentage (%)</label>
        <div style="display:flex; gap:10px;">
            <input type="number" id="risk" value="1.0" step="0.1">
            <select id="pairType">
                <option value="10">Major (EURUSD)</option>
                <option value="10">Gold (XAUUSD)</option>
                <option value="7">JPY Pairs</option>
            </select>
        </div>

        <label>Stop Loss (Pips)</label>
        <input type="number" id="sl" value="10">

        <button class="btn" onclick="calculate()">CALCULATE LOT SIZE</button>

        <div id="result" class="result-area">
            <span class="risk-display">RISK AMOUNT: <b id="riskAmount">$0</b></span>
            <span class="lot-display" id="lotSize">0.00</span>
            <div id="statusText" style="font-weight:bold; letter-spacing:1px;">SAFE TO TRADE</div>
        </div>
    </div>

    <script>
        function calculate() {
            // 1. Get Values
            let bal = parseFloat(document.getElementById('balance').value);
            let risk = parseFloat(document.getElementById('risk').value);
            let sl = parseFloat(document.getElementById('sl').value);
            // Standard lot value approx $10 per pip for majors/gold
            // Simple formula for estimation: RiskAmount / (SL * PipValue)
            
            // 2. Logic
            let riskMoney = bal * (risk / 100);
            let pipValue = 10; // Standard for USD pairs/Gold roughly
            
            let lots = riskMoney / (sl * pipValue);
            
            // Rounding to 2 decimals
            lots = Math.round(lots * 100) / 100;

            // 3. Display
            document.getElementById('riskAmount').innerText = "$" + riskMoney.toFixed(2);
            document.getElementById('lotSize').innerText = lots.toFixed(2);
            
            let resBox = document.getElementById('result');
            let status = document.getElementById('statusText');
            
            resBox.style.display = "block";
            
            // Visual Feedback
            if(risk > 2.0) {
                resBox.className = "result-area danger-mode";
                document.getElementById('lotSize').style.color = "#ef4444"; // Red
                status.innerText = "⚠️ HIGH RISK WARNING";
                status.style.color = "#ef4444";
            } else {
                resBox.className = "result-area safe-mode";
                document.getElementById('lotSize').style.color = "#22c55e"; // Green
                status.innerText = "✅ SAFE TO TRADE";
                status.style.color = "#22c55e";
            }
        }
    </script>
</body>
</html>
